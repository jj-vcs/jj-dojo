name: Restrict PR Merger
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  check-merger:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Actor is Author
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "PR Author: $AUTHOR"
          echo "Current Actor: $ACTOR"

          if [ "$AUTHOR" != "$ACTOR" ]; then
            echo "::error::Only the PR author ($AUTHOR) is allowed to trigger actions or merge this PR."
            exit 1
          fi
